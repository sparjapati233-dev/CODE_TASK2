<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | TechPandit</title>

    <!-- CSS -->
    <link rel="stylesheet" href="login.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <!-- LOGIN IMAGE -->

            <div class="auth-image">

                <img src="images/login.jpg" alt="TechPandit Login">

                <div class="image-overlay">

                    <h2>Welcome to<br>TechPandit</h2>

                    <p>
                        Turn your ideas into powerful digital experiences.
                    </p>

                </div>

            </div>


            <!-- LOGIN FORM -->

            <div class="auth-form">

                <div class="auth-logo">
                    <span>Tech</span>Pandit
                </div>

                <h1>Welcome Back</h1>

                <p class="auth-subtitle">
                    Login to continue to TechPandit
                </p>


                <form id="loginForm">

                    <!-- Email -->

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- Password -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <!-- Options -->

                    <div class="form-options">

                        <label>
                            <input type="checkbox">
                            Remember me
                        </label>

                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>


                    <!-- Login Button -->

                    <button
                        type="submit"
                        class="auth-button"
                    >
                        Login
                    </button>

                </form>


                <!-- Signup -->

                <div class="auth-switch">

                    Don't have an account?

                    <a href="signup.html">
                        Create Account
                    </a>

                </div>


                <!-- Home -->

                <a href="index.html" class="back-home">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
