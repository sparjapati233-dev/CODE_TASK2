<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | TechPandit</title>

    <!-- CSS -->
    <link rel="stylesheet" href="signup.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <!-- SIGNUP IMAGE -->

            <div class="auth-image">

                <img src="images/signup.jpg" alt="TechPandit Signup">

                <div class="image-overlay">

                    <h2>Join<br>TechPandit</h2>

                    <p>
                        Start your journey towards innovative digital solutions.
                    </p>

                </div>

            </div>


            <!-- SIGNUP FORM -->

            <div class="auth-form">

                <div class="auth-logo">
                    <span>Tech</span>Pandit
                </div>

                <h1>Create Account</h1>

                <p class="auth-subtitle">
                    Join TechPandit and start building.
                </p>


                <form id="signupForm">

                    <!-- Full Name -->

                    <div class="form-group">

                        <label for="fullName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <!-- Email -->

                    <div class="form-group">

                        <label for="signupEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="signupEmail"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- Password -->

                    <div class="form-group">

                        <label for="signupPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="signupPassword"
                            placeholder="Create a password"
                            required
                        >

                    </div>


                    <!-- Confirm Password -->

                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >

                    </div>


                    <!-- Terms -->

                    <div class="terms">

                        <label>

                            <input
                                type="checkbox"
                                required
                            >

                            I agree to the
                            <a href="#">
                                Terms & Conditions
                            </a>

                        </label>

                    </div>


                    <!-- Signup Button -->

                    <button
                        type="submit"
                        class="auth-button"
                    >
                        Create Account
                    </button>

                </form>


                <!-- Login -->

                <div class="auth-switch">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </div>


                <!-- Home -->

                <a href="index.html" class="back-home">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
